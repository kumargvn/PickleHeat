# Cloudflare Workers deployment. Secrets (JWT_SECRET, DATABASE_URL, STRIPE_*, DUPR_*) are set with
#   npx wrangler secret put NAME
# and never live in this file.
name = "pickleheat-api"
main = "src/entry/worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
PUBLIC_BASE_URL = "https://pickleheat-api.YOUR-SUBDOMAIN.workers.dev"
WEB_APP_URL = "https://kumargvn.github.io/PickleHeat/app/"
APPLE_AUDIENCES = "com.gudivada.pickleheat"
# Sign in with Google: the OAuth client ID from Google Cloud (same value as GOOGLE_CLIENT_ID in docs/app/config.js).
GOOGLE_CLIENT_IDS = ""
PLATFORM_FEE_BPS = "0"
DUPR_ENV = "uat"
ALLOW_DEV_AUTH = "false"
# Password reset and email confirmation go out through Resend. Set the secret RESEND_API_KEY, and a sender
# on a domain you verified in Resend. Until both are set, no email is sent.
EMAIL_FROM = ""
# iPhone push notifications: set APNS_KEY_ID and APNS_TEAM_ID here, and the secret APNS_PRIVATE_KEY
# (the contents of the .p8 key from Apple Developer → Keys → Apple Push Notifications service).
APNS_KEY_ID = ""
APNS_TEAM_ID = ""
APNS_BUNDLE_ID = "com.gudivada.pickleheat"
SAMPLE_TOURNAMENTS = "true"

# Every hour: refresh DUPR tokens about to expire and retry DUPR uploads that failed.
[triggers]
crons = ["17 * * * *"]
