name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "shared/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ios

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project PickleHeat.xcodeproj \
            -scheme PickleHeat \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log

      - name: Show build errors
        if: failure()
        run: |
          # Turn compiler and test errors into annotations on the run page (10 lines each).
          python3 - <<'EOF'
          import re
          lines = []
          for line in open("xcodebuild.log", errors="replace"):
              if re.search(r"error:|\*\* (BUILD|TEST) FAILED|Test Case .* failed|XCTAssert", line):
                  line = line.strip().replace("/Users/runner/work/PickleHeat/PickleHeat/ios/", "")
                  if line not in lines:
                      lines.append(line)
          for k in range(0, min(len(lines), 80), 10):
              print("::error title=Build errors " + str(k // 10 + 1) + "::" + "%0A".join(lines[k:k + 10]))
          EOF

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: ios/xcodebuild.log

  testflight:
    name: Upload to TestFlight
    needs: test
    # Turn on by adding the repository variable ENABLE_TESTFLIGHT = true
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_TESTFLIGHT == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      # Leave the PICKLEHEAT_API_URL repository variable empty to ship demo mode.
      PICKLEHEAT_API_URL: ${{ vars.PICKLEHEAT_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Use latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret $name"; exit 1; fi
          done

      - name: Install App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -z "$ASC_PRIVATE_KEY" ]; then echo "::error::Missing secret ASC_PRIVATE_KEY"; exit 1; fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PickleHeat.xcodeproj \
            -scheme PickleHeat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PickleHeat.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            PICKLEHEAT_API_URL="$PICKLEHEAT_API_URL"

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PickleHeat.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Build $BUILD_NUMBER uploaded. It appears in TestFlight after Apple finishes processing (usually 5-30 minutes)." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
