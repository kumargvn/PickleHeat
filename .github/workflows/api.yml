name: API

on:
  push:
    branches: [main]
    paths: ["server/**", "shared/**", "web/**", "docs/app/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["server/**", "shared/**", "web/**", "docs/app/**", ".github/workflows/api.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Workers after tests pass"
        type: boolean
        default: false

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bunx tsc --noEmit
      - name: Shared test vectors are up to date
        run: |
          bun run scripts/make-vectors.ts
          git diff --exit-code ../shared/vectors || (echo "::error::Run 'bun run vectors' in server/ and commit shared/vectors" && exit 1)
      - name: Demo API bundle is up to date
        working-directory: .
        run: |
          bun run web/build.ts
          git diff --exit-code docs/app/demo-api.js ios/PickleHeat/Resources/demo-api.js || (echo "::error::Run bun run web/build.ts and commit the demo bundles" && exit 1)

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    # Runs on manual dispatch with "deploy" ticked, or on main when ENABLE_API_DEPLOY = true.
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy) || (github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.ENABLE_API_DEPLOY == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Missing secret DATABASE_URL"; exit 1; fi
          for f in db/migrations/*.sql; do
            echo "Applying $f"
            bun -e "import { neon } from '@neondatabase/serverless'; const sql = neon(process.env.DATABASE_URL); const text = await Bun.file('$f').text(); for (const stmt of text.split(/;\s*\n/).map(s => s.trim()).filter(s => s && !s.split('\n').every(l => l.trim().startsWith('--') || !l.trim()))) await sql.query(stmt);"
          done
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
