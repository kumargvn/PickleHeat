# Xcode project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
name: PickleHeat

options:
  bundleIdPrefix: com.gudivada
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple Team ID. CI passes it in from the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: ""
    # The PickleHeat API. Empty = built-in demo mode (sample data, no account needed).
    # CI passes it in from the PICKLEHEAT_API_URL repository variable.
    PICKLEHEAT_API_URL: ""

targets:
  PickleHeat:
    type: application
    platform: iOS
    sources:
      - path: PickleHeat
        excludes:
          - PrivacyInfo.xcprivacy
      - path: PickleHeat/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Sample players, matches and tournaments for demo mode (shared with the API).
      - path: ../shared/sample-data.json
        buildPhase: resources
    entitlements:
      path: PickleHeat/PickleHeat.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.pickleheat
        PRODUCT_NAME: PickleHeat
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: PickleHeat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        PickleHeatAPIURL: $(PICKLEHEAT_API_URL)
        NSLocationWhenInUseUsageDescription: PickleHeat uses your location to find pickleball tournaments near you. You can type a city instead.
        CFBundleURLTypes:
          - CFBundleURLName: com.gudivada.pickleheat
            CFBundleURLSchemes:
              - pickleheat
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PickleHeatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickleHeatTests
      # Expected answers computed by the API's TypeScript code; the Swift engine must match.
      - path: ../shared/vectors
        buildPhase: resources
    dependencies:
      - target: PickleHeat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.pickleheat.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PickleHeat:
    build:
      targets:
        PickleHeat: all
        PickleHeatTests: [test]
    test:
      config: Debug
      targets:
        - PickleHeatTests
    archive:
      config: Release
