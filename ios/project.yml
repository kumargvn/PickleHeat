# Xcode project definition. Generate the .xcodeproj with:
#   brew install xcodegen && xcodegen generate
name: Pickora

options:
  bundleIdPrefix: com.gudivada
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Your Apple Team ID. CI passes it in from the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: ""
    # The Pickora API. Empty = built-in demo mode (sample data, no account needed).
    # CI passes it in from the PICKORA_API_URL repository variable.
    PICKORA_API_URL: ""

targets:
  Pickora:
    type: application
    platform: iOS
    sources:
      - path: Pickora
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Pickora/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Sample players, matches and tournaments for demo mode (shared with the API).
      - path: ../shared/sample-data.json
        buildPhase: resources
    entitlements:
      path: Pickora/Pickora.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.pickora
        PRODUCT_NAME: Pickora
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Pickora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        PickoraAPIURL: $(PICKORA_API_URL)
        NSLocationWhenInUseUsageDescription: Pickora uses your location to find pickleball tournaments near you. You can type a city instead.
        CFBundleURLTypes:
          - CFBundleURLName: com.gudivada.pickora
            CFBundleURLSchemes:
              - pickora
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: Logo
          UIImageRespectsSafeAreaInsets: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  PickoraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PickoraTests
      # Expected answers computed by the API's TypeScript code; the Swift engine must match.
      - path: ../shared/vectors
        buildPhase: resources
    dependencies:
      - target: Pickora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gudivada.pickora.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pickora:
    build:
      targets:
        Pickora: all
        PickoraTests: [test]
    test:
      config: Debug
      targets:
        - PickoraTests
    archive:
      config: Release
